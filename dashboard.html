  LLM INSTRUCTIONS (ChatGPT / Claude / etc.)
  ==========================================
  This is a self-contained HTML dashboard for a nonprofit CRM dataset.
  All 9 CSV tables are embedded in the EMBEDDED_CSV variable below — no fetching needed.

  ============================================================
  RULE 1: EVERY VALUE MUST BE COMPUTED FROM THE EMBEDDED DATA
  ============================================================
  Never hardcode numbers, labels, or counts. Every value displayed on the
  dashboard MUST be derived at runtime by iterating over the parsed CSV rows.
  If a metric cannot be computed from the tables below, it does not belong
  on this dashboard. Do not invent, estimate, or approximate values.

  ============================================================
  RULE 2: ONLY USE COLUMNS AND VALUES THAT EXIST IN THE SCHEMA
  ============================================================
  Before adding any chart, metric, or table, verify that every column name
  and every category/enum value you reference actually exists in the schema
  below. If it does not exist, do NOT add it.

  TABLES AND THEIR EXACT COLUMNS:

  people.csv
    id, first_name, last_name, email, phone, address, city, state, zip,
    company_id, role, created_at
    - role values: Individual Donor, Board Member, Volunteer,
      Program Participant, Event Attendee, Staff, Corporate Contact,
      Foundation Contact, Accounts Payable, VP of Giving, CSR Manager,
      Executive Director, Program Officer

  companies.csv
    id, name, type, address, city, state, zip, website,
    primary_contact_id, created_at
    - type values: Corporation, Foundation, Business, Law Firm,
      Nonprofit, University, Government

  payments.csv
    id, person_id, company_id, amount, category, payment_method,
    payment_date, campaign_id, notes
    - category values (ONLY these 5): donation, grant, sponsorship,
      service, event_ticket
    - payment_method values: credit_card, check, ach, cash, online, wire
    - THERE IS NO "in_kind" CATEGORY IN PAYMENTS.

  in_kind_gifts.csv
    id, person_id, company_id, description, estimated_value, date, category
    - category values: goods, services
    - This is a SEPARATE table. In-kind gifts are NOT in payments.

  events.csv
    id, name, date, location, capacity, ticket_price, campaign_id

  registrations.csv
    id, person_id, event_id, registered_at, attended, ticket_amount
    - attended values: yes, no

  campaigns.csv
    id, name, goal_amount, start_date, end_date, status
    - status values: active, completed

  memberships.csv
    id, person_id, level, fee, start_date, end_date, status
    - level values: Basic, Silver, Gold, Platinum
    - status values: active, expired, cancelled

  volunteer_hours.csv
    id, person_id, date, hours, activity, event_id
    - activity values: Event setup, Mentoring, Office admin,
      Fundraising calls, Data entry, Teaching, Transportation,
      Board meeting, Committee work, Community outreach

  TABLE RELATIONSHIPS (the only valid joins):
  - people.company_id → companies.id
  - payments.person_id → people.id
  - payments.company_id → companies.id
  - payments.campaign_id → campaigns.id
  - in_kind_gifts.person_id → people.id
  - in_kind_gifts.company_id → companies.id
  - registrations.person_id → people.id
  - registrations.event_id → events.id
  - events.campaign_id → campaigns.id
  - memberships.person_id → people.id
  - volunteer_hours.person_id → people.id
  - volunteer_hours.event_id → events.id

  There are NO other tables, columns, or relationships.

  ============================================================
  RULE 3: VALIDATE BEFORE DISPLAYING
  ============================================================
  When adding a new element to the dashboard:
  1. Identify which table(s) and column(s) the metric requires.
  2. Confirm those tables and columns exist in the schema above.
  3. Write the computation by filtering/aggregating the parsed data.
  4. Add a // VALIDATION comment above the computation explaining
     what tables and columns it uses, e.g.:
     // VALIDATION: payments.category='donation', payments.amount, payments.person_id
  5. Never filter on a column value that is not listed in the schema.
     For example, payments.category='in_kind' does NOT exist.

  ============================================================
  RULE 4: CHECKLIST BEFORE RETURNING THE FILE
  ============================================================
  Before returning the modified HTML, confirm:
  [ ] Every displayed number is computed from EMBEDDED_CSV at runtime
  [ ] Every column name referenced exists in the schema above
  [ ] Every filter value (e.g., category='donation') is a valid enum value
  [ ] No values are hardcoded, estimated, or hallucinated
  [ ] The EMBEDDED_CSV data block is returned in full, unmodified
  [ ] New computations have // VALIDATION comments

  ============================================================
  CONTEXT: THE SPIRIT OF THIS PROJECT
  ============================================================
  This dashboard accompanies a newsletter post called "What Is a Forest?"
  The core argument: definitions matter, and the nonprofit sector suffers
  from fuzzy ones. The dataset is designed to let a nonprofit leader
  explore that idea hands-on.

  Here is the full source post — it should guide the tone, purpose,
  and types of explorations this dashboard supports:

  ---

  What is a forest?

  A seemingly simple question with no clear answer.

  Scientists examined ten datasets to see how forests were defined and
  found that they only agreed on around 26% of the world's forest.
  Dense canopies in the Amazon were fairly easy, but scrubland and more
  scattered areas were harder.

  A forest is lots of trees. But what kind of trees? How concentrated
  must the trees be to constitute a forest? How large an area must
  they cover?

  As you drill into the details, it's easy to imagine how complicated
  the answer becomes.

  We can't dismiss this as an exercise either; politicians, scientists
  and businesses use this data to determine the best way to set policy
  and protect (or destroy) these resources.

  How can we preserve something we can't define? How will we know if
  conservation efforts are successful? Are forests growing or shrinking?
  Right now, it depends on who you ask.

  THE NONPROFIT PARALLEL:

  The nonprofit sector suffers from notoriously fuzzy definitions.
  When the time comes to demonstrate progress things start to sound
  a little hand wavy.

  "We collaborated with our partners to create systems change."

  What do you mean by "collaborate" and how does someone become your
  "partner" and what is "systems change?"

  If we don't have clear answers to these questions... *any* activity
  might be called "collaboration" and *any* person could be our
  "partner" and *any* "change" in *any* "system" might be celebrated.

  We can't be effective until we get specific.

  This plays out inside organizations too. A basic request like "give
  me a list of our donors" can devolve into chaos. Sometimes the root
  cause is a bad process, or a skills issue, but more often than not,
  it's a lack of definition.

  THE KEY EXAMPLE — "WHAT IS A DONOR?"

  Each definition produces a different result:

  1. "A person who gives us money" — too broad, includes service fees
     and ticket buyers.
  2. "A person who donates money" — better, but misses foundations
     and corporate sponsors.
  3. "A person who donates, or the point person from an org that gave
     a grant or sponsorship" — getting closer, but misses in-kind.
  4. "All of the above, plus anyone who provided goods or pro bono
     services" — the broadest reasonable definition.

  The ability to ask these questions is based on a strong data model
  (which demands definition), solid processes for capturing data, and
  patience to get into the weeds.

  We shouldn't be surprised when the executive director sends a
  message on Slack requesting the most updated donor list only to
  receive five different versions in response.

  When scientists map the forests they don't agree either.

  ---

  When modifying this dashboard, keep this spirit in mind:
  - Help the user SEE how definitions change outcomes
  - Show the same data through different lenses
  - Encourage exploration, not just reporting
  - Make the user feel like a data analyst, not a spectator

  ============================================================
  HOW TO MODIFY THIS DASHBOARD
  ============================================================
  - Data: already parsed into variables (people, payments, etc.)
  - Charts: ApexCharts — new ApexCharts(el, options).render()
  - Metric card: <div class="metric-card"> in the .metrics grid
  - Chart/table card: <div class="card"> in a .grid-2 or .grid-1
  - Styles: edit the <style> block; palette is indigo (#6366f1 family)
  - Return the COMPLETE file including EMBEDDED_CSV. Do not truncate.
-->

      var tickets = payments.filter(function(p) { return p.category === 'event_ticket'; });

      function sum(arr) { return arr.reduce(function(s, p) { return s + parseFloat(p.amount || 0); }, 0); }

      // VALIDATION: payments.amount, summed by category
      var totalDonations = sum(donations);
      var totalGrants = sum(grants);
      var totalSponsorship = sum(sponsorships);
      // VALIDATION: in_kind_gifts.estimated_value (separate table, NOT in payments)
      var totalInKind = in_kind_gifts.reduce(function(s, g) { return s + parseFloat(g.estimated_value || 0); }, 0);
      // VALIDATION: payments.amount (all categories)
      var totalRevenue = sum(payments);
      // VALIDATION: payments.person_id where category='donation'
      var uniqueDonors = new Set(donations.map(function(d) { return d.person_id; })).size;
      var avgGift = donations.length > 0 ? totalDonations / donations.length : 0;
      // VALIDATION: volunteer_hours.hours, volunteer_hours.person_id
      var totalVol = volunteer_hours.reduce(function(s, v) { return s + parseFloat(v.hours || 0); }, 0);
      var uniqueVols = new Set(volunteer_hours.map(function(v) { return v.person_id; })).size;

      // VALIDATION: donor definitions use payments.person_id + in_kind_gifts.person_id
      var defAny = new Set(payments.map(function(p) { return p.person_id; })).size;
      var defDon = new Set(donations.map(function(p) { return p.person_id; })).size;
      var defDGS = new Set([].concat(donations, grants, sponsorships).map(function(p) { return p.person_id; })).size;
      var allDonorIds = [].concat(
        donations.map(function(p) { return p.person_id; }),
        grants.map(function(p) { return p.person_id; }),
        sponsorships.map(function(p) { return p.person_id; }),
        in_kind_gifts.map(function(g) { return g.person_id; })
      );
      var defBroad = new Set(allDonorIds).size;

      // VALIDATION: payments.payment_date (YYYY-MM-DD), payments.amount where category='donation'
      var monthlyDon = {};
      donations.forEach(function(d) { var m = d.payment_date.substring(0, 7); monthlyDon[m] = (monthlyDon[m] || 0) + parseFloat(d.amount); });
      var sortedMonths = Object.keys(monthlyDon).sort();

      // VALIDATION: campaigns.name, campaigns.goal_amount, payments.campaign_id, payments.amount
      var campaignData = campaigns.map(function(c) {
        return { name: c.name, goal: parseFloat(c.goal_amount), raised: sum(payments.filter(function(p) { return p.campaign_id === c.id; })) };
      });

      // VALIDATION: payments.person_id, payments.amount where category='donation'; people.first_name, people.last_name
      var donorTotals = {};
      donations.forEach(function(d) { donorTotals[d.person_id] = (donorTotals[d.person_id] || 0) + parseFloat(d.amount); });
      var topDonors = Object.entries(donorTotals).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 10).map(function(e) {
        var p = people.find(function(pp) { return pp.id === e[0]; });
        return { name: p ? p.first_name + ' ' + p.last_name : 'ID ' + e[0], total: e[1] };
      });

      // VALIDATION: events.id, events.name; registrations.event_id, registrations.attended (values: yes, no)
      var eventStats = events.map(function(e) {
        var regs = registrations.filter(function(r) { return r.event_id === e.id; });
        var att = regs.filter(function(r) { return r.attended === 'yes'; }).length;
        return { name: e.name, registered: regs.length, attended: att, rate: regs.length > 0 ? Math.round(att / regs.length * 100) : 0 };
      });

      // VALIDATION: payments.company_id, payments.amount where category='grant' or 'sponsorship'; companies.id, companies.name
      var orgTotals = {};
      [].concat(grants, sponsorships).forEach(function(p) {
        if (!p.company_id) return;
        var co = companies.find(function(c) { return c.id === p.company_id; });
        var key = p.company_id;
        if (!orgTotals[key]) orgTotals[key] = { name: co ? co.name : 'Org ' + key, type: co ? co.type : '', total: 0 };
        orgTotals[key].total += parseFloat(p.amount || 0);
      });
      var topOrgs = Object.values(orgTotals).sort(function(a, b) { return b.total - a.total; });

      // ── Render ──
      var el = document.getElementById('app');
      el.innerHTML =
        '<div class="metrics">' +
          '<div class="metric-card"><div class="label">Charitable Revenue</div><div class="value">' + fmt(totalDonations + totalGrants + totalSponsorship) + '</div><div class="sub">Donations + Grants + Sponsorships</div></div>' +
          '<div class="metric-card"><div class="label">Total Revenue</div><div class="value">' + fmt(totalRevenue) + '</div><div class="sub">All sources including tickets &amp; fees</div></div>' +
          '<div class="metric-card"><div class="label">Unique Individual Donors</div><div class="value">' + num(uniqueDonors) + '</div><div class="sub">Avg gift: ' + fmt(avgGift) + ' across ' + num(donations.length) + ' donations</div></div>' +
          '<div class="metric-card"><div class="label">Grants &amp; Sponsorships</div><div class="value">' + fmt(totalGrants + totalSponsorship) + '</div><div class="sub">' + num(grants.length) + ' grants, ' + num(sponsorships.length) + ' sponsorships</div></div>' +
          '<div class="metric-card"><div class="label">In-Kind Contributions</div><div class="value">' + fmt(totalInKind) + '</div><div class="sub">' + num(in_kind_gifts.length) + ' gifts (goods &amp; pro bono services)</div></div>' +
          '<div class="metric-card"><div class="label">Volunteer Hours</div><div class="value">' + num(Math.round(totalVol)) + '</div><div class="sub">' + num(uniqueVols) + ' volunteers</div></div>' +
        '</div>' +

        '<div class="section-label">Defining &ldquo;Donor&rdquo;</div>' +
        '<div class="card"><h2>How many donors do we have? It depends on the definition.</h2>' +
          '<div class="donor-def">' +
            '<div class="def-card"><div class="def-count">' + defAny + '</div><div class="def-label">Anyone who<br>paid us anything</div></div>' +
            '<div class="def-card"><div class="def-count">' + defDon + '</div><div class="def-label">Donations<br>only</div></div>' +
            '<div class="def-card"><div class="def-count">' + defDGS + '</div><div class="def-label">Donations + Grants<br>+ Sponsorships</div></div>' +
            '<div class="def-card"><div class="def-count">' + defBroad + '</div><div class="def-label">All above<br>+ In-Kind Gifts</div></div>' +
          '</div>' +
        '</div>' +

        '<div class="section-label">Fundraising</div>' +
        '<div class="grid-2">' +
          '<div class="card"><h2>Revenue by Source</h2><div id="chartRev"></div></div>' +
          '<div class="card"><h2>Monthly Donations</h2><div id="chartTrend"></div></div>' +
        '</div>' +
        '<div class="grid-2">' +
          '<div class="card"><h2>Top Individual Donors</h2><table><thead><tr><th>Name</th><th style="text-align:right">Total</th></tr></thead><tbody>' +
            topDonors.map(function(d) { return '<tr><td>' + d.name + '</td><td style="text-align:right">' + fmt(d.total) + '</td></tr>'; }).join('') +
          '</tbody></table></div>' +
          '<div class="card"><h2>Top Corporate Funders (Grants &amp; Sponsorships)</h2><div id="chartOrgs"></div></div>' +
        '</div>' +
        '<div class="grid-1">' +
          '<div class="card"><h2>Campaign Progress</h2><div id="chartCampaign"></div></div>' +
        '</div>' +

        '<div class="section-label">Events</div>' +
        '<div class="card"><h2>Attendance by Event</h2><table><thead><tr><th style="width:35%">Event</th><th style="text-align:right">Registered</th><th style="text-align:right">Attended</th><th style="text-align:right;width:15%">Rate</th><th style="width:25%"></th></tr></thead><tbody>' +
          eventStats.map(function(e) { return '<tr><td>' + e.name + '</td><td style="text-align:right">' + e.registered + '</td><td style="text-align:right">' + e.attended + '</td><td style="text-align:right">' + e.rate + '%</td><td><div class="att-bar" style="width:100%"><span class="att-bar-fill" style="width:' + e.rate + '%"></span></div></td></tr>'; }).join('') +
        '</tbody></table></div>' +
        '<div class="spacer"></div>';

      // ── Charts ──
      var palette = ['#6366f1', '#8b5cf6', '#a78bfa', '#c4b5fd', '#e0e7ff'];

      new ApexCharts(document.getElementById('chartRev'), {
        chart: { type: 'bar', height: 280, fontFamily: 'Inter, sans-serif', toolbar: { show: false } },
        series: [{ name: 'Revenue', data: [totalDonations, totalGrants, totalSponsorship, sum(tickets), sum(services)] }],
        xaxis: { categories: ['Donations', 'Grants', 'Sponsorships', 'Event Tickets', 'Services'], labels: { style: { fontSize: '11px', colors: '#6b7280' } } },
        yaxis: { labels: { style: { colors: '#9ca3af', fontSize: '11px' }, formatter: function(v) { return '$' + (v/1000).toFixed(0) + 'k'; } } },
        colors: ['#6366f1'],
        plotOptions: { bar: { borderRadius: 3, columnWidth: '50%', distributed: true } },
        dataLabels: { enabled: false },
        grid: { borderColor: '#f3f4f6', strokeDashArray: 4 },
        legend: { show: false },
        tooltip: { y: { formatter: function(v) { return fmt(v); } } }
      }).render();

      new ApexCharts(document.getElementById('chartTrend'), {
        chart: { type: 'bar', height: 280, fontFamily: 'Inter, sans-serif', toolbar: { show: false } },
        series: [{ name: 'Donations', data: sortedMonths.map(function(m) { return monthlyDon[m]; }) }],
        xaxis: { categories: sortedMonths, labels: { rotate: -45, style: { fontSize: '9px', colors: '#9ca3af' } } },
        yaxis: { labels: { style: { colors: '#9ca3af', fontSize: '11px' }, formatter: function(v) { return '$' + (v/1000).toFixed(0) + 'k'; } } },
        colors: ['#6366f1'],
        plotOptions: { bar: { borderRadius: 3, columnWidth: '60%' } },
        dataLabels: { enabled: false },
        grid: { borderColor: '#f3f4f6', strokeDashArray: 4 },
        tooltip: { y: { formatter: function(v) { return fmt(v); } } }
      }).render();

      new ApexCharts(document.getElementById('chartOrgs'), {
        chart: { type: 'bar', height: 280, fontFamily: 'Inter, sans-serif', toolbar: { show: false } },
        series: [{ name: 'Total', data: topOrgs.map(function(o) { return o.total; }) }],
        xaxis: { categories: topOrgs.map(function(o) { return o.name; }), labels: { style: { fontSize: '11px', colors: '#9ca3af' }, formatter: function(v) { return '$' + (v/1000).toFixed(0) + 'k'; } } },
        yaxis: { labels: { style: { colors: '#6b7280', fontSize: '11px' } } },
        colors: ['#8b5cf6'],
        plotOptions: { bar: { horizontal: true, borderRadius: 3, barHeight: '55%' } },
        dataLabels: { enabled: false },
        grid: { borderColor: '#f3f4f6', strokeDashArray: 4 },
        tooltip: { y: { formatter: function(v) { return fmt(v); } } }
      }).render();

      new ApexCharts(document.getElementById('chartCampaign'), {
        chart: { type: 'bar', height: 280, fontFamily: 'Inter, sans-serif', toolbar: { show: false }, stacked: false },
        series: [
          { name: 'Raised', data: campaignData.map(function(c) { return c.raised; }) },
          { name: 'Goal', data: campaignData.map(function(c) { return c.goal; }) }
        ],
        xaxis: { categories: campaignData.map(function(c) { return c.name; }), labels: { style: { fontSize: '11px', colors: '#9ca3af' }, formatter: function(v) { return '$' + (v/1000).toFixed(0) + 'k'; } } },
        yaxis: { labels: { style: { colors: '#6b7280', fontSize: '11px' } } },
        colors: ['#6366f1', '#e5e7eb'],
        plotOptions: { bar: { horizontal: true, borderRadius: 3, barHeight: '60%' } },
        dataLabels: { enabled: false },
        grid: { borderColor: '#f3f4f6', strokeDashArray: 4 },
        legend: { position: 'bottom', fontSize: '12px', markers: { width: 8, height: 8, radius: 4 } },
        tooltip: { y: { formatter: function(v) { return fmt(v); } } }
      }).render();
    })();
  </script>
</body>
</html>
